<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>本体平台 · 数据链接</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="prototype-shell">
      <aside class="sidebar">
        <a class="brand text-brand" href="index.html">logo</a>
        <nav class="nav-group icon-nav" aria-label="主导航">
          <a href="index.html"><span class="nav-icon">◆</span>工作台</a>
          <a class="active" href="data.html"><span class="nav-icon">●</span>数据链接</a>
          <a href="modeling.html"><span class="nav-icon">⬡</span>本体建模</a>
          <a href="visualization.html"><span class="nav-icon">◇</span>模型可视化</a>
          <a href="marketplace.html"><span class="nav-icon">■</span>资产广场</a>
          <a href="chat.html"><span class="nav-icon">●</span>智能对话</a>
          <a href="admin.html"><span class="nav-icon">⚙</span>系统管理</a>
        </nav>
      </aside>

      <main class="module-shell">
        <aside class="module-nav">
          <h2>数据源管理</h2>
          <a class="active" href="data.html">我的数据源</a>
          <a href="data-new.html">新建连接</a>
          <a href="#">连接历史</a>
        </aside>

        <section class="module-content">
          <div class="module-head">
            <div>
              <h1>数据链接</h1>
              <p>连接各种结构化和非结构化数据源</p>
            </div>
            <a class="btn primary" href="data-new.html">新建数据源</a>
          </div>

          <div class="source-choice-grid">
            <a class="source-choice" href="data-new.html">
              <span class="choice-icon blue">▦</span>
              <h2>结构化数据</h2>
              <p>MySQL、PostgreSQL、MongoDB 等数据库</p>
            </a>
            <a class="source-choice" href="data-new.html">
              <span class="choice-icon green">▤</span>
              <h2>非结构化数据</h2>
              <p>PDF、Word、Excel、TXT 等文件</p>
            </a>
          </div>

          <section class="panel-card connected-list">
            <div class="panel-title">
              <h2>已连接数据源</h2>
            </div>
            <div class="source-row">
              <span class="source-icon blue">●</span>
              <div>
                <strong>客户管理系统</strong>
                <p>MySQL · 连接成功 · 已生成查询接口</p>
              </div>
              <span class="status ok">在线</span>
              <button class="delete-button" type="button">■</button>
            </div>
            <div class="source-row">
              <span class="source-icon green">■</span>
              <div>
                <strong>产品资料库</strong>
                <p>文件夹 · 156 个文件 · 待解析</p>
              </div>
              <span class="status warn">待处理</span>
              <button class="delete-button" type="button">■</button>
            </div>
            <div class="source-row">
              <span class="source-icon purple">◆</span>
              <div>
                <strong>供应商接口</strong>
                <p>REST API · 元数据探查完成</p>
              </div>
              <span class="status run">测试中</span>
              <button class="delete-button" type="button">■</button>
            </div>
          </section>
        </section>
      </main>
    </div>
  </body>
</html>
